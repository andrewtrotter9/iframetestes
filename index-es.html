<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuchar y responder con apoyo</title>
<style>
:root{
  --blue:#004d8c;
  --grey:#4d4f53;
  --white:#ffffff;
  --tint:#eaf1f8;
  --line:#c9d5e2;
  --ok:#1b6e35;
  --ok-bg:#e6f3ea;
  --bad:#a52a1f;
  --bad-bg:#fbeceb;
  --head:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Franklin Gothic Medium",Arial,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--grey);font:16px/1.55 var(--body)}
.shell{max-width:1000px;margin:0 auto;padding:28px 24px 48px}
#app:focus{outline:none}
h1,h2,h3{margin:0}
h1,.h-display{font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--blue);line-height:1.1}
h1{font-size:clamp(1.6rem,4.2vw,2.3rem)}
h2{font-family:var(--head);font-weight:800;color:var(--blue);font-size:clamp(1.3rem,3vw,1.65rem);line-height:1.2}
h1:focus,h2:focus{outline:none}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.on-blue :focus-visible,.btn:focus-visible{outline-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Hub ---------- */
.hub-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.hub-icon{flex:0 0 68px;height:68px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.hub-sub{font-weight:700;color:var(--grey);margin:.5em 0 .15em}
.hub-hint{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{position:relative;display:flex;text-align:left;padding:0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:150px;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(0,77,140,.18)}
.card-photo{flex:0 0 38%;max-width:132px;background:var(--tint);display:grid;place-items:center}
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.av{display:grid;place-items:center;border-radius:50%;color:var(--white);font-family:var(--head);font-weight:800;letter-spacing:.02em}
.av-0{background:var(--blue)}
.av-1{background:var(--grey)}
.card .av{width:76px;height:76px;font-size:1.7rem}
.card-body{flex:1;padding:12px 44px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card-name{font-family:var(--head);font-weight:800;font-size:1.25rem;color:var(--blue);text-transform:uppercase;line-height:1.1}
.card-role{font-weight:700;font-size:.85rem;color:var(--grey)}
.card-where{display:flex;align-items:center;gap:5px;font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.card-quote{font-size:.88rem;line-height:1.4;color:var(--grey)}
.card-quote b{color:var(--blue);font-size:1.3em;line-height:0;vertical-align:-.15em;margin-right:3px}
.card-go{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center}
.card.done{border-color:var(--blue)}
.badge-req{position:absolute;top:8px;right:8px;border:1px solid var(--grey);color:var(--grey);background:var(--white);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px}
.badge-done{position:absolute;top:8px;right:8px;background:var(--blue);color:var(--white);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;display:flex;gap:4px;align-items:center}
.info{display:flex;gap:12px;align-items:center;background:var(--tint);border-radius:8px;padding:12px 16px;margin-top:18px;font-size:.92rem}
.info-i{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.hub-foot{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-top:22px}
.tally{font-weight:700;color:var(--blue)}
.tally small{display:block;font-weight:400;color:var(--grey)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--white);border:2px solid var(--blue);border-radius:99px;padding:10px 26px;font-weight:700;letter-spacing:.02em}
.btn:hover{background:var(--grey);border-color:var(--grey)}
.btn[disabled]{background:#c8ccd2;border-color:#c8ccd2;color:#5c5f64;cursor:not-allowed}
.btn.alt{background:var(--white);color:var(--blue)}
.btn.alt:hover{background:var(--tint)}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- Scene screens ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:18px}
.who{display:flex;gap:12px;align-items:center}
.who .av,.who img{width:46px;height:46px;font-size:1.05rem;border-radius:50%;object-fit:cover;object-position:50% 25%}
.who-name{font-family:var(--head);font-weight:800;font-size:1.15rem;color:var(--blue);text-transform:uppercase;line-height:1.1}
.who-meta{font-size:.85rem}
.steps{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--blue);margin-bottom:14px}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--blue)}
.dot.on{background:var(--blue)}
.remember{border-left:4px solid var(--grey);background:var(--tint);padding:10px 14px;margin-bottom:16px;font-size:.92rem;border-radius:0 6px 6px 0}
.scene{background:var(--blue);color:var(--white);border-radius:10px;padding:22px 26px;margin-bottom:22px}
.scene .narr{font-style:italic;margin-bottom:.6em;opacity:.95}
.scene .quote{margin:0;font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.4;font-weight:700}
.scene .quote::before{content:"«"}
.scene .quote::after{content:"»"}
.recap{background:var(--tint);border-radius:10px;padding:18px 22px;margin-bottom:22px}
.recap h2{margin-bottom:.4em}
.prompt{margin:0 0 12px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--grey)}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--tint)}
.letter{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt-txt{flex:1;padding-top:3px}
.opt-tag{display:block;font-size:.8rem;font-weight:700;margin-top:3px}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .letter{background:var(--ok)}
.opt.good .opt-tag{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .letter{background:var(--bad)}
.opt.bad .opt-tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.faded{opacity:.62}
.fb{margin-top:16px;border-radius:10px;padding:16px 20px;border:2px solid var(--blue);background:var(--white)}
.fb:focus{outline:none}
.fb h3{font-family:var(--head);font-size:1.15rem;font-weight:800;color:var(--blue);margin-bottom:.35em}
.fb.good h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p:last-of-type{margin-bottom:0}
.fb .actions{margin-top:14px}
.kl{background:var(--white);border:2px solid var(--blue);border-radius:10px;padding:20px 24px}
.kl h2{margin-bottom:.4em}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.page-actions{margin-top:22px}

/* ---------- Quiz ---------- */
fieldset{border:0;margin:0;padding:0;min-inline-size:0}
legend{padding:0;margin-bottom:12px;font-weight:700;color:var(--blue)}
.chk{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--white)}
.chk:hover{border-color:var(--blue)}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:0 0 auto}
.chk.good{border-color:var(--ok);background:var(--ok-bg)}
.chk.bad{border-color:var(--bad);background:var(--bad-bg)}
.chk.miss{border-color:var(--grey);border-style:dashed}
.chk .tag{display:block;font-size:.8rem;font-weight:700}
.chk.good .tag{color:var(--ok)}
.chk.bad .tag{color:var(--bad)}
.panel{background:var(--blue);color:var(--white);border-radius:10px;padding:22px 26px}
.panel h2{color:var(--white);margin-bottom:.5em}
.panel p:last-child{margin-bottom:0}
.panel .btn{background:var(--white);color:var(--blue);border-color:var(--white)}
.panel .btn:hover{background:var(--tint)}
.panel :focus-visible{outline-color:var(--white)}

@media (max-width:560px){
  .shell{padding:18px 14px 36px}
  .hub-icon{flex-basis:52px;height:52px}
  .scene{padding:18px}
  .card-photo{flex-basis:30%}
  .card .av{width:58px;height:58px;font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <main id="app" tabindex="-1"></main>
  <div id="live" class="sr" aria-live="polite"></div>
  <p id="ver" style="margin-top:28px;font-size:.72rem;color:#4d4f53;opacity:.7"></p>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG – change these without touching the rest of the code
   ===================================================================== */
var CONFIG = {
  MIN_BRANCHES: 3,          // conversations that must be completed before the learner can continue
  REQUIRED_IDS: ['sofia','kwame'],   // conversations that MUST be completed (they contain the 'connecting to support' follow-ups)
  MAX_ATTEMPTS: 2,          // attempts allowed on the continuation questions and the quiz before the correct answer is shown
  REPORT_SCORE: false,      // true = send first-attempt accuracy to the LMS as the score
  VERSION: 'v5-ES · 2 intentos · seguimientos integrados',   // shown in small print at the bottom of the page
  SHOW_VERSION: true,       // set to false to hide the version label before launch
  SHOW_LEARNER_MESSAGE_WHEN_NO_LMS: false
};

/* =====================================================================
   CONTENT – all learner-facing text lives below this line.
   Text is written as in the script; {scriptName} is swapped for the
   display name (see CHARS) so a name change is a one-line edit.
   ===================================================================== */
var CHARS = [
  {id:'nuno',  scriptName:'Nuno',    name:'Nuno',   age:19, role:'Jugador',          country:'Brasil',   tone:0, photo:'',
   quote:'Sinceramente, no sé qué me pasa. Es que últimamente no me siento yo mismo.'},
  {id:'sofia', scriptName:'Sofia',   name:'Sofia',  age:27, role:'Entrenadora',      country:'Inglaterra', tone:1, photo:'',
   quote:'Estoy agotada todo el tiempo y me cuesta desconectar.'},
  {id:'c3',    scriptName:'Shanice', name:'Mariam', age:15, role:'Jugadora de la academia', country:'Marruecos', tone:0, photo:'',
   quote:'Ahora mismo todo me parece demasiado.'},
  {id:'kwame', scriptName:'Kwame',   name:'Kwame',  age:32, role:'Árbitro',          country:'Ghana',    tone:1, photo:'',
   quote:'Han cambiado cosas hace poco y me está costando mucho.'},
  {id:'yuki',  scriptName:'Yuki',    name:'Yuki',   age:41, role:'Delegado de equipo', country:'Japón',  tone:0, photo:'',
   quote:'Estoy preocupado por una persona muy cercana a mí.'},
  {id:'ratu',  scriptName:'Ratu',    name:'Ratu',   age:30, role:'Responsable de bienestar del club', country:'Fiyi', tone:1, photo:'',
   quote:'No sé muy bien qué necesito ahora mismo.'}
];

var TEXT = {
  title: 'Escuchar y responder con apoyo',
  hubSub: 'Has preguntado a alguien cómo está y quiere hablar contigo.',
  hubHint: 'Haz clic en una persona para ver qué podría contarte.',
  hubInfo: 'Cada conversación es única. Las personas pueden compartir muchas cosas distintas y el apoyo será diferente para cada una.',
  remember: 'Recuerda: todavía no sabemos adónde nos llevará ninguna de estas conversaciones. Nuestro papel no es averiguar qué le pasa a la persona ni decidir qué apoyo necesita.'
};

/* opts: [text, isCorrect, "what happens" text (retry mode only)] */
var BRANCHES = {

nuno: [
 {type:'q', narr:'Después del entrenamiento, Nuno se queda rezagado para hablar contigo. Te dice:',
  quote:'Sinceramente, no sé qué me pasa. Es que últimamente no me siento yo mismo.',
  prompt:'¿Qué le dices?',
  opts:[
   ['«¿Crees que podrías estar deprimido?»',0],
   ['«No pasa nada, no hace falta que lo tengas todo claro. ¿Cómo han ido las cosas?»',1],
   ['«¿Tiene algo que ver con que te hayan ascendido al primer equipo?»',0],
   ['«Eso nos pasa a todos alguna vez. Ya se te pasará.»',0]],
  fb:'Nuno te ha dicho que no sabe qué le pasa. Pedirle que ponga nombre a lo que ocurre, suponer una causa o aceptar que es normal son formas de cerrar la conversación. En cambio, invitarle a describir lo que le pasa mantiene la conversación abierta. La respuesta A le da un diagnóstico a un chico de 19 años, y lo hace alguien que no está cualificado para darlo.'},
 {type:'q',
  quote:'No lo sé. Es que me siento apagado. En los entrenamientos todo bien. Pero después no tengo ganas de hacer nada.',
  prompt:'¿Y ahora qué?',
  opts:[
   ['Preguntarle qué ha cambiado y cuándo notó el cambio por primera vez.',1],
   ['Sugerirle que vaya al médico del club.',0],
   ['Tranquilizarle diciéndole que parece cansancio normal.',0],
   ['Preguntarle si duerme y come bien.',0]],
  fb:'El hecho de que Nuno se describa como «apagado» y se esté apartando de actividades que antes hacía merece que lo entiendas mejor antes de ir más lejos. La respuesta B puede llegar a su debido tiempo, pero no es apropiada a los 30 segundos de empezar la conversación. La respuesta C zanja la cuestión antes de plantearla: Nuno ha descrito un cambio, y llamarlo cansancio normal le invita a dejarlo ahí. La respuesta D te convierte en evaluador.'},
 {type:'kl',
  quote:'Hace unas semanas. Lleva así desde más o menos febrero.',
  kl:['No has averiguado qué le pasa, y no hacía falta. Has establecido que algo ha cambiado, aproximadamente cuándo y que es algo que se mantiene en el tiempo. Eso basta para mantener la conversación abierta y poder retomarla más adelante. Si cuando vuelvas a hablar con él el problema sigue ahí, anima a Nuno a ir al médico o indícale el cauce médico que corresponda en tu organización. Si quiere más apoyo, puedes ayudarle a pensar qué podría resultarle útil, y acordarías con él qué se transmite y a quién.']}
],

sofia: [
 {type:'q',
  quote:'Estoy agotada todo el tiempo y me cuesta desconectar.',
  prompt:'¿Qué le dices?',
  opts:[
   ['«Deberías tomarte unos días libres.»',0],
   ['«Suena agotador. ¿Desde cuándo estás así?»',1],
   ['«Es un trabajo exigente. Eso viene con el puesto.»',0],
   ['«¿Has probado a acostarte antes?»',0]],
  fb:'La respuesta C trata el problema como algo propio del trabajo y cierra la conversación. Las respuestas A y D ofrecen soluciones antes de conocer el problema, y a una entrenadora con un contrato de corta duración, que le sugieran tomarse unos días libres puede sonarle a que piensas que no está pudiendo con todo.'},
 {type:'q',
  quote:'Desde hace un tiempo. La verdad es que no quiero que esto vaya más allá. Mi contrato termina en junio.',
  prompt:'¿Qué le dices?',
  opts:[
   ['«Tranquila, nadie se va a enterar de esto.»',0],
   ['«Lo entiendo. Esto queda entre tú y yo, salvo que lo que me cuentes suponga un riesgo para tu seguridad; en ese caso tendría que buscar ayuda, y te diría antes que voy a hacerlo.»',1],
   ['«No deberías tener que preocuparte por eso.»',0],
   ['«Tendría que comentárselo al director deportivo.»',0]],
  fb:'Los miedos de Sofia sobre su futuro son realistas y son la razón por la que mucha gente en el fútbol no dice nada. La respuesta C le quita importancia al problema. La respuesta A incluye una promesa que quizá no puedas cumplir. La respuesta D convierte una conversación sobre bienestar en un asunto formal. Dejar claros desde el principio los límites de la confidencialidad permite que el resto de la conversación tenga lugar.'},
 {type:'kl',
  quote:'Vale, gracias.',
  kl:['Las personas sopesan lo que puede costarles hablar. Para el personal con contratos inestables, ese cálculo es real. No puedes eliminar el riesgo, pero ser honesto sobre la confidencialidad desde el principio permite que alguien siga hablando. Di con tus propias palabras lo que puedes y no puedes mantener en privado. Un riesgo para la seguridad es el motivo más habitual por el que puede que tengas que transmitir algo, pero no es el único: las obligaciones de protección y salvaguarda, y las responsabilidades legales y de notificación de tu organización, también pueden exigirte que compartas información. Averigua qué es lo que te corresponde antes de necesitar saberlo. La declaración de consenso del COI de 2026 recoge el miedo a ser descartado y la preocupación por perder oportunidades deportivas entre las principales barreras para pedir ayuda. El cálculo de Sofia no es ni raro ni irracional.']}
],

c3: [
 {type:'q', narr:'Después de una sesión de entrenamiento, Shanice te dice en voz baja:',
  quote:'Ahora mismo todo me parece demasiado.',
  prompt:'¿Qué es lo primero que debes hacer?',
  opts:[
   ['Preguntar a Shanice qué ha estado pasando.',0],
   ['Ir a un lugar privado y tranquilo para que Shanice pueda hablar con libertad.',0],
   ['Antes de que Shanice siga, hacerle saber que, según lo que te cuente, puede que no puedas guardártelo para ti.',1],
   ['Tranquilizar a Shanice diciéndole que lo que cuente estará a salvo contigo.',0]],
  fb:'Shanice tiene 15 años. Si te cuenta algo que plantea un problema de protección, tendrás que transmitirlo, y ella merece saberlo antes, y no después, de decidir qué contar. La respuesta A es la pregunta correcta en el orden equivocado: la invita a contarte algo antes de que sepa qué puedes tener que hacer con ello. En cuanto a la respuesta B, un espacio privado no es lo mismo que un espacio aislado, y no debes estar a solas con un menor a puerta cerrada. En algunos contextos, que un adulto de distinto sexo hable a solas con una menor de 15 años ya es un problema en sí mismo, por buena que sea la intención. En ese caso, la solución es que haya otro adulto presente o que sea otro adulto quien mantenga la conversación, y no que la conversación no tenga lugar. La respuesta D es la opción más perjudicial, porque le promete algo que quizá no puedas cumplir.'},
 {type:'q',
  narr:'Tú dices: «Antes de que me cuentes nada más, tengo que decirte que, como eres menor de 18 años, si algo me preocupa por tu seguridad, no podré guardarlo solo entre tú y yo. Siempre te diré lo que voy a hacer.»',
  quote:'Vale. Es el colegio, el fútbol y todo lo de casa. Es demasiado.',
  prompt:'¿Y ahora qué?',
  opts:[
   ['Preguntarle en concreto qué está pasando en casa.',0],
   ['Preguntar a Shanice qué parte le pesa más.',1],
   ['Decirle a Shanice que hablarás con sus padres.',0],
   ['Tranquilizar a Shanice diciéndole que muchos jóvenes de la academia se sienten así.',0]],
  fb:'Shanice ha mencionado tres cosas que le están afectando. Dejar que sea ella quien elija cuál le pesa más hace que siga al mando de su propia situación. La respuesta A la presiona sobre el aspecto que más curiosidad te despierta a ti, que quizá no sea el que ella necesita tratar. La respuesta C le quita capacidad de decisión, y todavía no sabes si el problema está en casa. La respuesta D le dice a Shanice que lo que ha descrito no tiene nada de especial, lo que le da una razón para dejar de contarlo.'},
 {type:'kl',
  quote:'Seguramente el colegio. Tengo exámenes y entreno cuatro noches a la semana.',
  kl:['Cuando hables con un niño, una niña o una persona joven, deja claros los límites de la confidencialidad antes, y no después, de que te cuente nada. Dejar claros los límites desde el principio puede resultar incómodo, pero protege la relación. Si Shanice hubiera seguido contando algo que había que comunicar, es importante que hubiera sabido lo que iba a pasar después.']}
],

kwame: [
 {type:'q',
  quote:'Han cambiado cosas hace poco y me está costando mucho.',
  prompt:'¿Qué le dices?',
  opts:[
   ['«¿Qué ha cambiado?»',1],
   ['«¿Son los insultos? Han ido a peor esta temporada.»',0],
   ['«Arbitrar es difícil. Hay que saber aguantar las críticas.»',0],
   ['«¿Has hablado con tu responsable regional?»',0]],
  fb:'Kwame te ha abierto una puerta; atraviésala en lugar de adivinar qué hay detrás. La respuesta B supone que se trata de los insultos, y una suposición plausible es más difícil de corregir que una inverosímil. La respuesta C es justo el mensaje que disuade a los árbitros de hablar. La respuesta D pasa a derivarlo antes de saber qué ha cambiado.'},
 {type:'q',
  quote:'Me he mudado de región por trabajo. Ahora no conozco a nadie en mis partidos. Conduzco hasta allí, arbitro y conduzco de vuelta a casa.',
  prompt:'¿Cuál es la respuesta más útil?',
  opts:[
   ['Decirle a Kwame que con el tiempo se acostumbrará.',0],
   ['Preguntar a Kwame si sigue en contacto con gente de la región donde arbitraba antes y si hay algo que le ayudaría a sentirse menos solo en los partidos.',1],
   ['Sugerirle que se apunte a un gimnasio de la zona.',0],
   ['Ofrecerte como su principal persona de contacto en la región.',0]],
  fb:'El problema de Kwame es el aislamiento, algo habitual en el arbitraje: trabaja junto a compañeros a los que quizá no conoce, viaja al partido y vuelve a casa, y entre partido y partido no tiene un equipo ni un cuerpo técnico a su alrededor. Preguntarle qué le ayudaría le permite seguir teniendo el control de la situación. La respuesta A le pide a Kwame que espere, lo que lo deja en la misma situación. La respuesta C lo manda a un gimnasio, donde también estaría solo. Aunque la respuesta D es generosa, te convierte en toda su red de apoyo, lo cual no es sostenible y no es el objetivo.'},

  var api=null, ver=null, ok=false, start=Date.now(), finished=false;

    var n=0;

        if(w.API) return {a:w.API,v:'1.2'};

      w=w.parent; n++;

    if(!ok) return '';

  }

    if(!ok) return;
    try{ ver==='2004' ? api.SetValue(k04,String(v)) : api.LMSSetValue(k12,String(v)); }catch(e){}
  }

    if(!ok) return;
    try{ ver==='2004' ? api.Commit('') : api.LMSCommit(''); }catch(e){}
  }

    init:function(){
      var r=look(window) || (window.opener ? look(window.opener) : null);

    kwame: build({bg:'#c9d8e4',skin:'#6b4430',skinD:'#59382a',lip:'#3e2419',

      hairFront:'<path d="M35 62 C32 36 46 27 60 27 C75 27 88 36 85 62 C82 49 74 43 60 43 C46 43 38 49 35 62Z" fill="#17110e"/>'})

/* =====================================================================
   STATE
   ===================================================================== */
var S = { done:[], first:{}, complete:false };
var route = {stage:'hub'};
var dec = null;          // state of the decision currently on screen
var quiz = null;         // state of the quiz
var app = document.getElementById('app');
var live = document.getElementById('live');

function charById(id){ for(var i=0;i<CHARS.length;i++) if(CHARS[i].id===id) return CHARS[i]; return null; }
function t(s){
  if(!s) return '';
  CHARS.forEach(function(c){ if(c.scriptName!==c.name) s=s.split(c.scriptName).join(c.name); });
  return s;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function T(s){ return esc(t(s)); }
function letter(i){ return String.fromCharCode(65+i); }

function save(){
  var key = route.stage==='b' ? 'hub' : route.stage;
  Scorm.setData(JSON.stringify({s:key, d:S.done, f:S.first, c:S.complete?1:0}));
  Scorm.setBookmark(route.stage+(route.k?':'+route.k:''));
}
function load(){
  var raw = Scorm.getData();
  if(!raw) return;
  try{
    var o = JSON.parse(raw);
    S.done = o.d||[]; S.first = o.f||{}; S.complete = !!o.c;
    var s = o.s;
    if(s==='quiz'||s==='fb'||s==='end'||s==='hub') route={stage:s};
  }catch(e){}
}
function scorePct(){
  var k=Object.keys(S.first); if(!k.length) return 0;
  var n=0; k.forEach(function(x){ n+=S.first[x]?1:0; });
  return Math.round(100*n/k.length);
}
function say(msg){ live.textContent=''; setTimeout(function(){ live.textContent=msg; },30); }

/* =====================================================================
   RENDERING
   ===================================================================== */
function avatar(c){
  var src=c.photo||PORTRAITS[c.id];
  if(src) return '<img src="'+src+'" alt="">';
  var ini = c.name.replace(/[^A-Za-z\u00C0-\u024F]/g,'').slice(0,1).toUpperCase();
  return '<span class="av av-'+c.tone+'" aria-hidden="true">'+esc(ini)+'</span>';
}
var ICON_PIN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#004d8c" stroke-width="2.4" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
var ICON_GO='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#004d8c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
var ICON_TICK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
var ICON_HUB='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="8" height="6" rx="1.5"/><circle cx="12" cy="13" r="2"/><path d="M8.5 20c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/><circle cx="5.5" cy="14.5" r="1.5"/><circle cx="18.5" cy="14.5" r="1.5"/></svg>';

function setView(html, focusSel){
  app.innerHTML = html;
  window.scrollTo(0,0);
  var f = app.querySelector(focusSel||'[data-focus]');
  if(f){ f.setAttribute('tabindex','-1'); try{ f.focus({preventScroll:true}); }catch(e){ f.focus(); } }
}

function who(c, rightHTML){
  return '<div class="topbar"><div class="who">'+avatar(c)+
    '<div><div class="who-name">'+esc(c.name)+', '+c.age+'</div><div class="who-meta">'+esc(c.role)+' · '+esc(c.country)+'</div></div></div>'+
    (rightHTML||'')+'</div>';
}
function stepsHTML(i,n,label){
  var d=''; for(var k=0;k<n;k++) d+='<span class="dot'+(k<=i?' on':'')+'"></span>';
  return '<div class="steps"><span>'+esc(label)+'</span><span class="dots" aria-hidden="true">'+d+'</span></div>';
}

/* ---- Hub ---- */
function minMet(){
  if(S.done.length < CONFIG.MIN_BRANCHES) return false;
  for(var i=0;i<CONFIG.REQUIRED_IDS.length;i++) if(S.done.indexOf(CONFIG.REQUIRED_IDS[i])<0) return false;
  return true;
}
function renderHub(){
  var cards = CHARS.map(function(c){
    var done = S.done.indexOf(c.id)>=0;
    return '<button class="card'+(done?' done':'')+'" data-action="open" data-id="'+c.id+'" aria-label="'+esc(c.name)+', '+c.age+', '+esc(c.role)+', '+esc(c.country)+'. '+(done?'Conversación completada. Abrir de nuevo.':'Abrir esta conversación.')+'">'+
      '<span class="card-photo">'+avatar(c)+'</span>'+
      '<span class="card-body">'+
        '<span class="card-name">'+esc(c.name)+', '+c.age+'</span>'+
        '<span class="card-role">'+esc(c.role)+'</span>'+
        '<span class="card-where">'+ICON_PIN+esc(c.country)+'</span>'+
        '<span class="card-quote"><b aria-hidden="true">«</b>'+esc(c.quote)+'</span>'+
      '</span>'+
      (done?'<span class="badge-done">'+ICON_TICK+'Hecha</span>':(CONFIG.REQUIRED_IDS.indexOf(c.id)>=0?'<span class="badge-req">Obligatoria</span>':''))+
      '<span class="card-go" aria-hidden="true">'+ICON_GO+'</span>'+
    '</button>';
  }).join('');
  var need = Math.max(0, CONFIG.MIN_BRANCHES - S.done.length);
  var reqNote='';
  if(CONFIG.REQUIRED_IDS.length){
    var miss = CONFIG.REQUIRED_IDS.filter(function(id){return S.done.indexOf(id)<0}).map(function(id){return charById(id).name});
    if(miss.length) reqNote=' También debes completar: '+miss.join(', ')+'.';
  }
  var tally = minMet()
    ? '<div class="tally">'+S.done.length+' de '+CHARS.length+' conversaciones completadas<small>Ya puedes continuar o explorar antes alguna conversación más.</small></div>'
    : '<div class="tally">'+S.done.length+' de '+CHARS.length+' conversaciones completadas<small>Completa al menos '+CONFIG.MIN_BRANCHES+' para continuar. Explorar más de una te permite compararlas.'+reqNote+'</small></div>';
  setView(
    '<div class="hub-head"><div class="hub-icon">'+ICON_HUB+'</div><div>'+
      '<h1 class="sr" data-focus>'+esc(TEXT.title)+'</h1>'+
      '<p class="hub-sub" style="margin-top:0">'+esc(TEXT.hubSub)+'</p>'+
      '<p class="hub-hint">'+esc(TEXT.hubHint)+'</p></div></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="info"><span class="info-i" aria-hidden="true">i</span><span>'+esc(TEXT.hubInfo)+'</span></div>'+
    '<div class="hub-foot">'+tally+'<button class="btn" data-action="toquiz"'+(minMet()?'':' disabled')+'>Continuar</button></div>'
  );
}

/* ---- Decision block (shared by branches and continuations) ---- */
function decisionInner(){
  var s=dec.screen, mode=dec.mode, h='';
  h += '<h2 class="prompt" id="prompt">'+T(s.prompt)+'</h2><ul class="opts" aria-labelledby="prompt">';
  s.opts.forEach(function(o,i){
    var cls='opt', tag='', disabled='';
    var tried = dec.tried.indexOf(i)>=0;
    if(dec.solved){
      disabled=' disabled';
      if(o[1]){ cls+=' good'; tag='Mejor respuesta'; }
      else if(dec.pick===i){ cls+=' bad'; tag='Tu elección: no es la mejor respuesta'; }
      else if(tried){ cls+=' bad'; tag='Elegida: no es la mejor respuesta'; }
      else cls+=' faded';
    } else if(tried){
      cls+=' bad'; disabled=' disabled'; tag='Elegida: no es la mejor respuesta';
    }
    h += '<li><button class="'+cls+'" data-action="pick" data-i="'+i+'"'+disabled+' aria-pressed="'+((dec.pick===i||tried)?'true':'false')+'">'+
      '<span class="letter" aria-hidden="true">'+letter(i)+'</span>'+
      '<span class="opt-txt"><span class="sr">Opción '+letter(i)+': </span>'+T(o[0])+(tag?'<span class="opt-tag">'+tag+'</span>':'')+'</span></button></li>';
  });
  h += '</ul>';
  if(dec.msg){
    var m=dec.msg;
    h += '<div class="fb '+m.kind+'" id="fb" tabindex="-1" role="status"><h3>'+esc(m.title)+'</h3>'+
      (m.body?'<p>'+T(m.body)+'</p>':'')+
      (m.note?'<p><strong>'+esc(m.note)+'</strong></p>':'')+
      (m.kind==='bad' && mode==='cq' && !dec.solved ? '<div class="actions"><button class="btn" data-action="retry">Volver y elegir de nuevo</button></div>' : '')+
      '</div>';
  }
  if(dec.solved){
    h += '<div class="actions page-actions"><button class="btn" data-action="next" id="cont">Continuar</button></div>';
  }
  return h;
}
function refreshDecision(focusFb){
  var box=document.getElementById('dec');
  box.innerHTML=decisionInner();
  var f = focusFb ? document.getElementById('fb') : null;
  if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function sceneHTML(s){
  if(!s.narr && !s.quote) return '';
  return '<div class="scene on-blue">'+
    (s.narr?'<p class="narr">'+T(s.narr)+'</p>':'')+
    (s.quote?'<blockquote class="quote">'+T(s.quote)+'</blockquote>':'')+'</div>';
}
function klHTML(paras){
  return '<div class="kl"><h2>Aprendizaje clave</h2>'+paras.map(function(p){return '<p>'+T(p)+'</p>';}).join('')+'</div>';
}

/* ---- Branch screens ---- */
function renderBranch(){
  var c=charById(route.id), list=BRANCHES[route.id], s=list[route.i], n=list.length;
  var top = who(c,'<button class="link" data-action="exit">Volver a las conversaciones</button>');
  var steps = stepsHTML(route.i,n,'Pantalla '+(route.i+1)+' de '+n);
  var remember = route.i===0 ? '<p class="remember">'+esc(TEXT.remember)+'</p>' : '';
  var body;
  if(s.type==='kl'){
    if(s.more){
      body = sceneHTML(s)+klHTML(s.kl)+
        '<div class="actions page-actions"><button class="btn" data-action="next">Continuar la conversación</button></div>';
    } else {
      if(S.done.indexOf(route.id)<0){ S.done.push(route.id); save(); say('Conversación con '+c.name+' completada.'); }
      body = sceneHTML(s)+klHTML(s.kl)+
        '<div class="actions page-actions"><button class="btn" data-action="exit">Volver a las conversaciones</button></div>';
    }
    setView(top+steps+body);
    var k=app.querySelector('.kl h2'); if(k){k.setAttribute('data-focus','');k.setAttribute('tabindex','-1');k.focus({preventScroll:true});}
    return;
  }
  dec = {screen:s, mode:(s.type==='cq'?'cq':'q'), key:'b:'+route.id+':'+route.i, tried:[], solved:false, pick:null, msg:null};
  setView(top+steps+remember+sceneHTML(s)+'<div id="dec">'+decisionInner()+'</div>');
  // focus the scene so screen readers read the situation first
  var sc=app.querySelector('.scene'); if(sc){sc.setAttribute('tabindex','-1'); sc.focus({preventScroll:true});}
}

/* ---- Quiz ---- */
function renderQuiz(){
  quiz = {sel:{}, checked:false, attempts:0, correct:false, revealed:false};
  drawQuiz(true);
}
function drawQuiz(initial){
  var items = QUIZ.items.map(function(it,i){
    var on=!!quiz.sel[i], cls='chk', tag='';
    if(quiz.checked){
      if(quiz.revealed){
        if(it[1]){cls+=' good';tag=on?'Correcto':'Respuesta correcta'}
        else if(on){cls+=' bad';tag='No corresponde'}
      } else {
        if(it[1]&&on){cls+=' good';tag='Correcto'}
        else if(!it[1]&&on){cls+=' bad';tag='No corresponde'}
        else if(it[1]&&!on){cls+=' miss';tag='Se te pasó esta'}
      }
    }
    return '<li><label class="'+cls+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+(quiz.checked?' disabled':'')+'>'+
      '<span>'+esc(it[0])+(tag?'<span class="tag">'+tag+'</span>':'')+'</span></label></li>';
  }).join('');
  var result='', actions='';
  if(quiz.checked){
    result='<div class="fb '+(quiz.correct?'good':'bad')+'" id="fb" tabindex="-1" role="status"><h3>'+(quiz.correct?'Correcto':'No del todo')+'</h3><p>'+esc(quiz.correct?QUIZ.passMsg:(quiz.revealed?QUIZ.revealMsg:QUIZ.failMsg))+'</p></div>';
    actions = (quiz.correct||quiz.revealed)
      ? '<button class="btn" data-action="tofb">Continuar</button>'
      : '<button class="btn" data-action="qretry">Intentarlo de nuevo</button>';
  } else {
    var any=Object.keys(quiz.sel).some(function(k){return quiz.sel[k]});
    actions='<button class="btn" data-action="qcheck"'+(any?'':' disabled')+'>Comprobar respuestas</button>';
  }
  var html = '<h1 data-focus>'+esc(QUIZ.title)+'</h1><p style="margin-top:.6em">'+esc(QUIZ.intro)+'</p>'+
    '<fieldset><legend>'+esc(QUIZ.q)+' <span style="font-weight:400;color:#4d4f53">'+esc(QUIZ.hint)+'</span></legend>'+
    '<ul class="opts" id="qlist">'+items+'</ul></fieldset>'+result+'<div class="actions page-actions">'+actions+'</div>';
  if(initial){ setView(html); }
  else {
    app.innerHTML=html;
    var f=document.getElementById('fb'); if(f){f.focus({preventScroll:true});f.scrollIntoView({block:'nearest'});}
  }
}

/* ---- Simple text pages ---- */
function renderText(o, nextAction, btn, asPanel){
  var h = asPanel
    ? '<div class="panel on-blue"><h1 data-focus style="color:#fff">'+esc(o.title)+'</h1>'+o.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>'
    : '<h1 data-focus>'+esc(o.title)+'</h1><div style="margin-top:.8em">'+o.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>';
  h += '<div class="actions page-actions"><button class="btn" data-action="'+nextAction+'">'+esc(btn)+'</button></div>';
  setView(h);
}

/* ---- End ---- */
function renderEnd(){
  if(!S.complete){
    S.complete=true; save();
    Scorm.complete(CONFIG.REPORT_SCORE ? scorePct() : undefined);
    say('Actividad completada.');
  }
  setView('<div class="panel on-blue"><h1 data-focus style="color:#fff">'+esc(END.title)+'</h1>'+
    END.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>'+
    '<p class="page-actions" style="font-weight:700;color:#004d8c">'+esc(END.done)+'</p>'+
    '<div class="actions"><button class="btn alt" data-action="restart">Repasar las conversaciones de nuevo</button></div>');
}

function render(){
  switch(route.stage){
    case 'hub': renderHub(); break;
    case 'b': renderBranch(); break;
    case 'quiz': renderQuiz(); break;
    case 'fb': renderText(FEEDBACK,'toend','Continuar'); break;
    case 'end': renderEnd(); break;
    default: renderHub();
  }
}
function go(r){ route=r; render(); save(); }

/* =====================================================================
   EVENTS
   ===================================================================== */
app.addEventListener('change', function(e){
  var el=e.target;
  if(el.matches && el.matches('#qlist input[type=checkbox]')){
    quiz.sel[el.getAttribute('data-i')] = el.checked;
    var any=Object.keys(quiz.sel).some(function(k){return quiz.sel[k]});
    var b=app.querySelector('[data-action=qcheck]'); if(b) b.disabled=!any;
  }
});

app.addEventListener('click', function(e){
  var b=e.target.closest('[data-action]'); if(!b || b.disabled) return;
  var a=b.getAttribute('data-action');

  if(a==='open'){ go({stage:'b', id:b.getAttribute('data-id'), i:0}); }
  else if(a==='exit'){ go({stage:'hub'}); }
  else if(a==='toquiz'){ go({stage:'quiz'}); }
  else if(a==='tofb'){ go({stage:'fb'}); }
  else if(a==='toend'){ go({stage:'end'}); }
  else if(a==='restart'){ go({stage:'hub'}); }

  else if(a==='qcheck'){
    quiz.attempts++; quiz.checked=true;
    var ok=true; QUIZ.items.forEach(function(it,i){ if(!!it[1]!==!!quiz.sel[i]) ok=false; });
    quiz.correct=ok;
    if(!ok && quiz.attempts>=CONFIG.MAX_ATTEMPTS) quiz.revealed=true;
    if(!(('quiz') in S.first)) S.first['quiz']= (ok && quiz.attempts===1) ? 1 : 0;
    drawQuiz(false); save();
  }
  else if(a==='qretry'){ quiz.checked=false; drawQuiz(false); var h=app.querySelector('legend'); if(h){h.setAttribute('tabindex','-1');h.focus();} }

  else if(a==='pick'){
    if(dec.solved) return;
    var i=+b.getAttribute('data-i'), o=dec.screen.opts[i];
    if(dec.mode==='q'){
      dec.pick=i; dec.solved=true;
      S.first[dec.key]= o[1]?1:0;
      dec.msg = o[1] ? {kind:'good',title:'Correcto',body:dec.screen.fb} : {kind:'bad',title:'No es la mejor respuesta',body:dec.screen.fb};
      refreshDecision(true);
    } else {
      if(o[1]){
        dec.pick=i; dec.solved=true;
        if(!(dec.key in S.first)) S.first[dec.key]=1;
        dec.msg = {kind:'good', title:'Correcto', body:dec.screen.fb||''};
      } else {
        dec.tried.push(i);
        S.first[dec.key]=0;
        if(dec.tried.length >= CONFIG.MAX_ATTEMPTS){
          dec.solved=true; dec.revealed=true;
          dec.msg = {kind:'bad', title:'Qué ocurre', body:o[2]||'',
            note:'Este era tu segundo intento, así que la mejor respuesta aparece ahora resaltada. Échale un vistazo y continúa.'};
        } else {
          dec.msg = {kind:'bad', title:'Qué ocurre', body:o[2]||''};
        }
      }
      refreshDecision(true);
    }
    save();
  }
  else if(a==='retry'){
    dec.msg=null; refreshDecision(false);
    var first=document.querySelector('#dec .opt:not([disabled])'); if(first) first.focus();
  }
  else if(a==='next'){
    if(route.stage==='b'){ go({stage:'b', id:route.id, i:route.i+1}); }
  }
});

/* =====================================================================
   START
   ===================================================================== */
(function(){var v=document.getElementById('ver'); if(v){ if(CONFIG.SHOW_VERSION) v.textContent=CONFIG.VERSION; else v.style.display='none'; }})();
Scorm.init();
load();
render();
window.addEventListener('pagehide', function(){ Scorm.finish(S.complete); });
window.addEventListener('beforeunload', function(){ Scorm.finish(S.complete); });
})();
</script>
